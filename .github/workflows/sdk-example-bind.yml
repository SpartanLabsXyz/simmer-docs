name: SDK Example Bind

# Proves every documented SDK example binds against the minimum simmer-sdk
# version the docs claim to support (.sdk-doc-floor). Catches the class of bug
# where a doc example uses a kwarg/method the shipped wheel rejects — which a
# builder copying the example hits as a TypeError. See scripts/check_sdk_examples.py.

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [simmer-sdk-published]

jobs:
  sdk-example-bind:
    name: SDK Example Bind (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [floor, latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install simmer-sdk for ${{ matrix.target }} bind
        run: |
          install_pinned_sdk() {
            version="$1"
            attempts=10
            delay=30
            for attempt in $(seq 1 "$attempts"); do
              echo "Installing simmer-sdk==$version (attempt $attempt/$attempts)"
              if pip install "simmer-sdk==$version" pytest; then
                return 0
              fi
              if [ "$attempt" -eq "$attempts" ]; then
                break
              fi
              echo "simmer-sdk==$version is not available yet; retrying in ${delay}s"
              sleep "$delay"
            done
            echo "Failed to install simmer-sdk==$version after $attempts attempts"
            return 1
          }

          FLOOR="$(cat .sdk-doc-floor)"
          if [ "${{ matrix.target }}" = "floor" ]; then
            install_pinned_sdk "$FLOOR"
          elif [ -n "${{ github.event.client_payload.sdk_version || '' }}" ]; then
            install_pinned_sdk "${{ github.event.client_payload.sdk_version }}"
          else
            echo "Installing latest simmer-sdk"
            pip install --upgrade simmer-sdk pytest
          fi

      - name: Self-test the checker
        run: pytest scripts/test_check_sdk_examples.py -q

      - name: Bind documented SDK examples against ${{ matrix.target }} signature
        run: python scripts/check_sdk_examples.py --target "${{ matrix.target }}"
